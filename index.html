<!DOCTYPE html>
<html lang="fr" class="dark">

    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { dark: { 950: '#090d16', 900: '#0f172a', 800: '#1e293b' } } } } };

</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-20">

        <span class="text-lg font-bold">AniPulse</span>
      </div>
      
      <div class="bg-slate-950 border border-slate-700 p-0.5 rounded-lg flex items-center">
        <button id="mode-anime" onclick="setMode('anime')" class="px-3 py-1 rounded-md text-xs font-bold bg-indigo-600 text-white shadow transition">Anime</button>
        <button id="mode-manga" onclick="setMode('manga')" class="px-3 py-1 rounded-md text-xs font-bold text-slate-400 hover:text-white transition">Manga</button>

      </div>

    <form id="search-container" class="relative w-full flex items-center gap-2" onsubmit="handleSearchSubmit(event)">
      <div class="relative flex-1">

      <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl text-xs font-bold text-white transition shadow"><i class="fa-solid fa-magnifying-glass mr-1"></i> Chercher</button>
    </form>

  <main class="p-4">
    <h1 id="page-title" class="text-xl font-bold mb-4"><span class="text-indigo-500 mr-2">●</span>Top Animes</h1>
    
    <div id="global-filters" class="flex flex-col gap-2 mb-4 bg-slate-900/40 p-2.5 rounded-xl border border-slate-800/80">
      
      <div id="watchlist-status-filters" class="hidden gap-2 overflow-x-auto pb-1 scrollbar-hide whitespace-nowrap border-b border-slate-800 mb-1">
      </div>

      <div id="media-filters" class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide whitespace-nowrap items-center">
        <select id="genre-select" onchange="setGenreFilter(this.value)" class="bg-slate-950 border border-slate-700 text-[10px] rounded-lg px-2 py-1 outline-none text-slate-200 font-semibold h-[26px]">
          <option value="all">Tous les genres</option>
          <option value="Action">Action</option>
          <option value="Adventure">Aventure</option>
          <option value="Comedy">Comédie</option>
          <option value="Drama">Drame</option>
          <option value="Fantasy">Fantasy</option>
          <option value="Horror">Horreur</option>
          <option value="Romance">Romance</option>
          <option value="Sci-Fi">Sci-Fi</option>
          <option value="Slice of Life">Tranche de vie</option>
          <option value="Sports">Sports</option>
          <option value="Supernatural">Surnaturel</option>
        </select>
        <div class="w-px h-4 bg-slate-700 mx-1"></div>

      <div id="watchlist-sort" class="hidden items-center gap-2 mt-1 border-t border-slate-800 pt-2">

          <option value="user_score">Trier par Ma Note</option>

    <div id="main-content">
      <div class="flex flex-col items-center py-20">
        <div class="w-8 h-8 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mb-3"></div>
        <p class="text-slate-400 text-xs">Chargement...</p>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex justify-around py-2 px-1 z-40">
    <button onclick="setTab('top')" id="nav-top" class="flex flex-col items-center gap-1 py-1 px-1.5 text-indigo-400">
      <i class="fa-solid fa-fire text-base"></i><span class="text-[9px] font-medium">Top</span>
    </button>
    <button onclick="setTab('airing')" id="nav-airing" class="flex flex-col items-center gap-1 py-1 px-1.5 text-slate-400">
      <i class="fa-solid fa-bolt text-base"></i><span id="nav-airing-text" class="text-[9px] font-medium">Saison</span>
    </button>
    <button onclick="setTab('watchlist')" id="nav-watchlist" class="flex flex-col items-center gap-1 py-1 px-1.5 text-slate-400">
      <i class="fa-solid fa-bookmark text-base"></i><span class="text-[9px] font-medium">Liste</span>
    </button>
    <button onclick="setTab('trailers')" id="nav-trailers" class="flex flex-col items-center gap-1 py-1 px-1.5 text-slate-400">
      <i class="fa-solid fa-video text-base"></i><span class="text-[9px] font-medium">Trailers</span>
    </button>
    <button onclick="setTab('random')" id="nav-random" class="flex flex-col items-center gap-1 py-1 px-1.5 text-slate-400">
      <i class="fa-solid fa-dice text-base"></i><span class="text-[9px] font-medium">Aléatoire</span>
    </button>
    <button onclick="setTab('profile')" id="nav-profile" class="flex flex-col items-center gap-1 py-1 px-1.5 text-slate-400">
      <i class="fa-solid fa-user text-base"></i><span class="text-[9px] font-medium">Profil</span>
    </button>
  </nav>

  <div id="modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-0 sm:p-4">
    <div id="modal-card" class="bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-3xl max-w-md w-full p-5 relative max-h-[90vh] flex flex-col shadow-2xl">
      <button onclick="closeModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white p-2 z-10"><i class="fa-solid fa-xmark text-xl"></i></button>
      <div id="modal-body" class="overflow-y-auto scrollbar-hide flex-1 pb-4"></div>
    </div>
  </div>

  <script>
    const CLIENT_ID = '7c1600431d6d174d68c3a1baa21bd8dc';
    const SERVEUR_URL = 'https://anipulse-serveur.onrender.com';
    let appMode = 'anime';
    let currentTab = 'top';
    let currentStatusFilter = 'all';
    let currentMediaFilter = 'all';
    let currentGenreFilter = 'all';
    let currentSort = 'title';
    let currentSearch = '';
    let itemsData = [];
    let userProfile = null;

    function loginMAL() {
      const verifier = Array.from(crypto.getRandomValues(new Uint8Array(128))).map(x => 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[x % 66]).join('');
      localStorage.setItem('mal_code_verifier', verifier);
      window.location.href = `https://myanimelist.net/v1/oauth2/authorize?response_type=code&client_id=${CLIENT_ID}&code_challenge=${verifier}&code_challenge_method=plain`;
    }

    async function fetchMAL(endpoint, method = 'GET', body = null) {
      const token = localStorage.getItem('mal_access_token');
      const headers = token ? { 'Authorization': `Bearer ${token}` } : { 'X-MAL-CLIENT-ID': CLIENT_ID };
      const options = { method, headers };
      if (body) {
        options.body = new URLSearchParams(body);
        headers['Content-Type'] = 'application/x-www-form-urlencoded';
      }
      const res = await fetch(`${SERVEUR_URL}/api/${endpoint}`, options);
      if (res.status === 401) { localStorage.removeItem('mal_access_token'); window.location.reload(); return null; }
      if (!res.ok) throw new Error('Erreur de requête');
      if (method !== 'DELETE') {
        const text = await res.text();
        return text ? JSON.parse(text) : {};
      }
      return null;
    }

    function setMode(mode) {
      if (appMode === mode) return;
      appMode = mode;
      
      document.getElementById('mode-anime').className = mode === 'anime' ? 'px-3 py-1 rounded-md text-xs font-bold bg-indigo-600 text-white shadow transition' : 'px-3 py-1 rounded-md text-xs font-bold text-slate-400 hover:text-white transition';
      document.getElementById('mode-manga').className = mode === 'manga' ? 'px-3 py-1 rounded-md text-xs font-bold bg-indigo-600 text-white shadow transition' : 'px-3 py-1 rounded-md text-xs font-bold text-slate-400 hover:text-white transition';
      
      document.getElementById('nav-airing-text').innerText = mode === 'anime' ? 'Saison' : 'Publié';
      document.getElementById('search-input').placeholder = `Rechercher un ${mode}...`;

      const trailersBtn = document.getElementById('nav-trailers');
      if (mode === 'anime') {
        trailersBtn.style.display = 'flex';
      } else {
        trailersBtn.style.display = 'none';
        if (currentTab === 'trailers') {
          setTab('top');
          return;
        }
      }

      renderFiltersUI();
      setTab('top');
    }

    function renderFiltersUI() {
      const statusContainer = document.getElementById('watchlist-status-filters');
      if (appMode === 'anime') {
        statusContainer.innerHTML = `
          <button onclick="setStatusFilter('all')" id="status-all" class="px-3 py-1.5 rounded-full text-[11px] font-semibold bg-indigo-600 text-white transition">Tous</button>
          <button onclick="setStatusFilter('watching')" id="status-watching" class="px-3 py-1.5 rounded-full text-[11px] font-semibold bg-slate-800 text-slate-400 transition hover:bg-slate-700">En cours</button>
          <button onclick="setStatusFilter('plan_to_watch')" id="status-plan_to_watch" class="px-3 py-1.5 rounded-full text-[11px] font-semibold bg-slate-800 text-slate-400 transition hover:bg-slate-700">À voir</button>
          <button onclick="setStatusFilter('completed')" id="status-completed" class="px-3 py-1.5 rounded-full text-[11px] font-semibold bg-slate-800 text-slate-400 transition hover:bg-slate-700">Terminé</button>
          <button onclick="setStatusFilter('on_hold')" id="status-on_hold" class="px-3 py-1.5 rounded-full text-[11px] font-semibold bg-slate-800 text-slate-400 transition hover:bg-slate-700">En pause</button>
          <button onclick="setStatusFilter('dropped')" id="status-dropped" class="px-3 py-1.5 rounded-full text-[11px] font-semibold bg-slate-800 text-slate-400 transition hover:bg-slate-700">Abandonné</button>
        `;
      } else {
        statusContainer.innerHTML = `
          <button onclick="setStatusFilter('all')" id="status-all" class="px-3 py-1.5 rounded-full text-[11px] font-semibold bg-indigo-600 text-white transition">Tous</button>
          <button onclick="setStatusFilter('reading')" id="status-reading" class="px-3 py-1.5 rounded-full text-[11px] font-semibold bg-slate-800 text-slate-400 transition hover:bg-slate-700">En cours</button>
          <button onclick="setStatusFilter('plan_to_read')" id="status-plan_to_read" class="px-3 py-1.5 rounded-full text-[11px] font-semibold bg-slate-800 text-slate-400 transition hover:bg-slate-700">À lire</button>
          <button onclick="setStatusFilter('completed')" id="status-completed" class="px-3 py-1.5 rounded-full text-[11px] font-semibold bg-slate-800 text-slate-400 transition hover:bg-slate-700">Terminé</button>
          <button onclick="setStatusFilter('on_hold')" id="status-on_hold" class="px-3 py-1.5 rounded-full text-[11px] font-semibold bg-slate-800 text-slate-400 transition hover:bg-slate-700">En pause</button>
          <button onclick="setStatusFilter('dropped')" id="status-dropped" class="px-3 py-1.5 rounded-full text-[11px] font-semibold bg-slate-800 text-slate-400 transition hover:bg-slate-700">Abandonné</button>
        `;
      }

      const formatContainer = document.getElementById('format-filters-container');
      if (appMode === 'anime') {
        formatContainer.innerHTML = `
          <button onclick="setMediaFilter('all')" id="media-all" class="px-3 py-1 rounded-lg text-[10px] font-semibold bg-slate-700 text-white transition h-[26px]">Tous</button>
          <button onclick="setMediaFilter('tv')" id="media-tv" class="px-3 py-1 rounded-lg text-[10px] font-semibold bg-slate-900 border border-slate-700 text-slate-400 transition hover:bg-slate-800 h-[26px]">TV</button>
          <button onclick="setMediaFilter('movie')" id="media-movie" class="px-3 py-1 rounded-lg text-[10px] font-semibold bg-slate-900 border border-slate-700 text-slate-400 transition hover:bg-slate-800 h-[26px]">Film</button>
          <button onclick="setMediaFilter('ova')" id="media-ova" class="px-3 py-1 rounded-lg text-[10px] font-semibold bg-slate-900 border border-slate-700 text-slate-400 transition hover:bg-slate-800 h-[26px]">OVA</button>
        `;
      } else {
        formatContainer.innerHTML = `
          <button onclick="setMediaFilter('all')" id="media-all" class="px-3 py-1 rounded-lg text-[10px] font-semibold bg-slate-700 text-white transition h-[26px]">Tous</button>
          <button onclick="setMediaFilter('manga')" id="media-manga" class="px-3 py-1 rounded-lg text-[10px] font-semibold bg-slate-900 border border-slate-700 text-slate-400 transition hover:bg-slate-800 h-[26px]">Manga</button>
          <button onclick="setMediaFilter('light_novel')" id="media-light_novel" class="px-3 py-1 rounded-lg text-[10px] font-semibold bg-slate-900 border border-slate-700 text-slate-400 transition hover:bg-slate-800 h-[26px]">LN</button>
          <button onclick="setMediaFilter('manhwa')" id="media-manhwa" class="px-3 py-1 rounded-lg text-[10px] font-semibold bg-slate-900 border border-slate-700 text-slate-400 transition hover:bg-slate-800 h-[26px]">Manhwa</button>
        `;
      }
    }

    function setTab(tab) {
      currentTab = tab;
      ['top', 'airing', 'watchlist', 'trailers', 'random', 'profile'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if(btn) {
            btn.className = (t === tab) ? 'flex flex-col items-center gap-1 py-1 px-1.5 text-indigo-400' : 'flex flex-col items-center gap-1 py-1 px-1.5 text-slate-400';
        }
      });

      const labelType = appMode === 'anime' ? 'Animes' : 'Mangas';
      const titles = { 
        top: `Top ${labelType}`, 
        airing: appMode === 'anime' ? 'Saison Actuelle' : 'Top Publiés', 
        watchlist: 'Ma Liste', 
        trailers: 'Trailers (Saison Actuelle)',
        random: `${appMode === 'anime' ? 'Anime' : 'Manga'} Aléatoire`, 
        profile: 'Mon Profil' 
      };
      document.getElementById('page-title').innerHTML = `<span class="text-indigo-500 mr-2">●</span>${titles[tab]}`;
      
      const globalFilters = document.getElementById('global-filters');
      const statusFilters = document.getElementById('watchlist-status-filters');
      const sortSelect = document.getElementById('watchlist-sort');
      const searchContainer = document.getElementById('search-container');
      const searchInput = document.getElementById('search-input');
      
      if (tab === 'profile' || tab === 'random' || tab === 'trailers') {
        globalFilters.classList.add('hidden');
        searchContainer.classList.add('hidden');
      } else {
        searchContainer.classList.remove('hidden');
        if (tab === 'watchlist') {
          globalFilters.classList.remove('hidden');
          statusFilters.classList.replace('hidden', 'flex');
          sortSelect.classList.replace('hidden', 'flex');
          searchInput.placeholder = "Filtrer ma liste...";
          setStatusFilter('all');
        } else {
          globalFilters.classList.remove('hidden');
          statusFilters.classList.replace('flex', 'hidden');
          sortSelect.classList.replace('flex', 'hidden');
          searchInput.placeholder = `Rechercher un ${appMode}...`;
          currentSearch = '';
          searchInput.value = '';
        }
      }
      
      setMediaFilter('all');
      setGenreFilter('all');
      document.getElementById('genre-select').value = 'all';
      loadData();
    }

    function setStatusFilter(filter) {
      currentStatusFilter = filter;
      const allStatuses = appMode === 'anime' 
        ? ['all', 'watching', 'completed', 'plan_to_watch', 'on_hold', 'dropped']
        : ['all', 'reading', 'completed', 'plan_to_read', 'on_hold', 'dropped'];

      allStatuses.forEach(f => {
        const btn = document.getElementById(`status-${f}`);
        if(btn) btn.className = (f === filter) ? 'px-3 py-1.5 rounded-full text-[11px] font-semibold bg-indigo-600 text-white transition' : 'px-3 py-1.5 rounded-full text-[11px] font-semibold bg-slate-800 text-slate-400 transition hover:bg-slate-700';
      });
      renderGrid();
    }

    function setMediaFilter(filter) {
      currentMediaFilter = filter;
      const allMedia = appMode === 'anime' ? ['all', 'tv', 'movie', 'ova'] : ['all', 'manga', 'light_novel', 'manhwa'];
      allMedia.forEach(f => {
        const btn = document.getElementById(`media-${f}`);
        if(btn) btn.className = (f === filter) ? 'px-3 py-1 rounded-lg text-[10px] font-semibold bg-slate-700 text-white transition h-[26px]' : 'px-3 py-1 rounded-lg text-[10px] font-semibold bg-slate-900 border border-slate-700 text-slate-400 transition hover:bg-slate-800 h-[26px]';
      });
      renderGrid();
    }

    function setGenreFilter(genre) {
      currentGenreFilter = genre;
      renderGrid();
    }

    function setSort(sortType) {
      currentSort = sortType;
      renderGrid();
    }

    function handleLiveSearch(e) {
      if (currentTab === 'watchlist') {
        currentSearch = e.target.value.trim().toLowerCase();
        renderGrid();
      }
    }

    function handleSearchSubmit(e) {
      e.preventDefault(); 
      document.getElementById('search-input').blur(); 
      
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;

      if (currentTab === 'watchlist') {
        currentSearch = q.toLowerCase();
        renderGrid();
      } else {
        executeGlobalSearch(q);
      }
    }

    async function executeGlobalSearch(q) {
      const container = document.getElementById('main-content');
      container.innerHTML = `<div class="flex flex-col items-center py-20"><div class="w-8 h-8 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin"></div><p class="text-slate-400 text-xs mt-3">Recherche en cours...</p></div>`;
      document.getElementById('page-title').innerHTML = `<span class="text-indigo-500 mr-2">●</span>Résultats: ${q}`;
      
      const fields = appMode === 'anime' ? 'id,title,main_picture,mean,media_type,my_list_status,num_list_users,genres,num_episodes' : 'id,title,main_picture,mean,media_type,my_list_sta

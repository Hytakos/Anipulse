<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AniPulse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    // SCRIPT DE DESTRUCTION DU CACHE
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (let reg of regs) { reg.unregister(); }
      });
    }
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { dark: { 950: '#090d16', 900: '#0f172a', 800: '#1e293b' } } } } };
  </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-20">
  
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 px-4 py-3 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold"><i class="fa-solid fa-play"></i></div>
      <span class="text-lg font-bold">AniPulse</span>
    </div>
    <!-- BOUTON CONNEXION EN DUR DANS LE HTML -->
    <div id="user-area">
      <button onclick="loginMAL()" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white shadow-md">Connexion</button>
    </div>
  </header>

  <main class="p-4">
    <h1 id="page-title" class="text-xl font-bold mb-6"><span class="text-indigo-500 mr-2">●</span>Top Animes</h1>
    
    <div id="main-content">
      <div class="flex flex-col items-center py-20">
        <div class="w-8 h-8 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mb-3"></div>
        <p class="text-slate-400 text-xs">Vérification de la connexion...</p>
      </div>
    </div>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex justify-around py-2 px-3 z-40">
    <button onclick="setTab('top')" id="nav-top" class="flex flex-col items-center gap-1 py-1 text-indigo-400">
      <i class="fa-solid fa-fire text-lg"></i><span class="text-[10px] font-medium">Top</span>
    </button>
    <button onclick="setTab('airing')" id="nav-airing" class="flex flex-col items-center gap-1 py-1 text-slate-400">
      <i class="fa-solid fa-tv text-lg"></i><span class="text-[10px] font-medium">Saison</span>
    </button>
    <button onclick="setTab('watchlist')" id="nav-watchlist" class="flex flex-col items-center gap-1 py-1 text-slate-400">
      <i class="fa-solid fa-bookmark text-lg"></i><span class="text-[10px] font-medium">Ma Liste</span>
    </button>
  </nav>

  <script>
    const CLIENT_ID = '7c1600431d6d174d68c3a1baa21bd8dc';
    const SERVEUR_URL = 'https://anipulse-serveur.onrender.com';
    let currentTab = 'top';

    function loginMAL() {
      const verifier = Array.from(crypto.getRandomValues(new Uint8Array(128))).map(x => 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[x % 66]).join('');
      localStorage.setItem('mal_code_verifier', verifier);
      window.location.href = `https://myanimelist.net/v1/oauth2/authorize?response_type=code&client_id=${CLIENT_ID}&code_challenge=${verifier}&code_challenge_method=plain`;
    }

    function setTab(tab) {
      currentTab = tab;
      document.getElementById('nav-top').className = (tab === 'top') ? 'flex flex-col items-center gap-1 py-1 text-indigo-400' : 'flex flex-col items-center gap-1 py-1 text-slate-400';
      document.getElementById('nav-airing').className = (tab === 'airing') ? 'flex flex-col items-center gap-1 py-1 text-indigo-400' : 'flex flex-col items-center gap-1 py-1 text-slate-400';
      document.getElementById('nav-watchlist').className = (tab === 'watchlist') ? 'flex flex-col items-center gap-1 py-1 text-indigo-400' : 'flex flex-col items-center gap-1 py-1 text-slate-400';
      
      const titles = { top: 'Top Animes', airing: 'Saison Actuelle', watchlist: 'Ma Liste' };
      document.getElementById('page-title').innerHTML = `<span class="text-indigo-500 mr-2">●</span>${titles[tab]}`;
      loadData();
    }

    async function loadData() {
      const container = document.getElementById('main-content');
      container.innerHTML = `<div class="flex flex-col items-center py-20"><div class="w-8 h-8 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mb-3"></div><p class="text-slate-400 text-xs">Chargement en cours...</p></div>`;
      
      try {
        const token = localStorage.getItem('mal_access_token');
        if (currentTab === 'watchlist' && !token) {
          container.innerHTML = `<div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center mt-10"><p class="text-slate-300 text-sm mb-4">Connectez-vous pour voir votre liste</p><button onclick="loginMAL()" class="bg-indigo-600 px-6 py-2 rounded-xl text-white font-bold">Connexion MAL</button></div>`;
          return;
        }

        let endpoint = (currentTab === 'watchlist') 
          ? 'users/@me/animelist?limit=40&fields=id,title,main_picture,mean' 
          : `anime/ranking?ranking_type=${currentTab === 'airing' ? 'airing' : 'all'}&limit=40&fields=id,title,main_picture,mean`;
        
        const headers = token ? { 'Authorization': `Bearer ${token}` } : { 'X-MAL-CLIENT-ID': CLIENT_ID };

        const res = await fetch(`${SERVEUR_URL}/api/${endpoint}`, { headers });
        if (res.status === 401) { localStorage.removeItem('mal_access_token'); loginMAL(); return; }
        if (!res.ok) throw new Error("Le serveur Render est inaccessible.");
        
        const json = await res.json();
        const items = json.data || [];
        
        if (items.length === 0) {
          container.innerHTML = `<p class="text-slate-400 text-center py-10">Aucun anime trouvé.</p>`;
          return;
        }

        let html = `<div class="grid grid-cols-2 gap-4">`;
        items.forEach(item => {
          const img = item.node.main_picture?.large || item.node.main_picture?.medium || '';
          const score = item.node.mean || '-';
          html += `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden relative">
              <img src="${img}" class="w-full aspect-[3/4] object-cover" />
              <div class="absolute top-2 right-2 bg-slate-950/80 px-2 py-1 rounded-lg text-[10px] font-bold text-amber-400">★ ${score}</div>
              <div class="p-3"><h3 class="font-bold text-slate-200 text-xs line-clamp-2">${item.node.title}</h3></div>
            </div>`;
        });
        html += `</div>`;
        container.innerHTML = html;

      } catch (e) {
        container.innerHTML = `<div class="bg-rose-900/20 border border-rose-800 p-4 rounded-xl text-center"><p class="text-rose-400 text-xs">${e.message}</p></div>`;
      }
    }

    async function initApp() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');

      if (code) {
        try {
          const res = await fetch(`${SERVEUR_URL}/oauth/token`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ client_id: CLIENT_ID, grant_type: 'authorization_code', code: code, code_verifier: localStorage.getItem('mal_code_verifier') })
          });
          const data = await res.json();
          if (data.access_token) {
            localStorage.setItem('mal_access_token', data.access_token);
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        } catch(e) {}
      }

      const token = localStorage.getItem('mal_access_token');
      if (token) {
        try {
          const userRes = await fetch(`${SERVEUR_URL}/api/users/@me`, { headers: { 'Authorization': `Bearer ${token}` } });
          if (userRes.ok) {
            const user = await userRes.json();
            document.getElementById('user-area').innerHTML = `<div class="flex items-center gap-2 px-3 py-1 bg-slate-800 rounded-lg border border-slate-700"><span class="text-emerald-400 text-xs font-bold">${user.name}</span><button onclick="localStorage.removeItem('mal_access_token'); window.location.reload();" class="text-slate-400 hover:text-rose-400 ml-1"><i class="fa-solid fa-right-from-bracket"></i></button></div>`;
          } else {
            localStorage.removeItem('mal_access_token');
          }
        } catch(e) {}
      }
      loadData();
    }

    window.onload = initApp;
  </script>
</body>
</html>

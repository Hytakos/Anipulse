<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AniPulse - MAL Sync</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>[v-cloak] { display: none !important; }</style>
  <script>
    if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js"); }
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { dark: { 950: '#090d16', 900: '#0f172a', 800: '#1e293b' } } } } }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-20 md:pb-0 selection:bg-indigo-500 selection:text-white">
  <div id="app" v-cloak class="flex flex-col min-h-screen">
    
    <!-- En-tête mobile/desktop -->
    <header class="bg-slate-900/95 backdrop-blur border-b border-slate-800 sticky top-0 z-40 px-4 py-3 flex flex-col sm:flex-row items-center gap-3">
      <div class="flex items-center justify-between w-full sm:w-auto gap-3">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-indigo-500/25">
            <i class="fa-solid fa-play"></i>
          </div>
          <span class="text-lg font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">AniPulse</span>
        </div>
        
        <div class="flex items-center sm:hidden">
          <div v-if="userProfile" class="flex items-center gap-2 px-3 py-1 rounded-xl border border-slate-800 bg-slate-950 text-xs font-semibold text-emerald-400">
            <span>{{ userProfile.name }}</span>
            <button @click="logoutMAL" class="text-slate-400 hover:text-rose-400 ml-1"><i class="fa-solid fa-right-from-bracket"></i></button>
          </div>
          <button v-else @click="loginMAL" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white">
            Connexion
          </button>
        </div>
      </div>

      <div class="w-full sm:flex-1 sm:max-w-md sm:mx-auto">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input v-model="searchQuery" @keyup.enter="handleSearch" type="text" placeholder="Rechercher un anime..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-100 focus:border-indigo-500 outline-none"/>
        </div>
      </div>

      <div class="hidden sm:flex items-center gap-3">
        <div v-if="userProfile" class="flex items-center gap-3 px-4 py-1.5 rounded-xl border border-slate-800 bg-slate-900">
          <span class="text-sm font-semibold text-emerald-400">{{ userProfile.name }}</span>
          <button @click="logoutMAL" class="text-slate-400 hover:text-rose-400 text-sm ml-2"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
        <button v-else @click="loginMAL" class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-500 shadow-lg transition">
          <i class="fa-solid fa-user"></i><span>Connexion MAL</span>
        </button>
      </div>
    </header>

    <div class="flex flex-1">
      <aside class="hidden md:flex w-64 bg-slate-900/40 border-r border-slate-800/80 p-4 flex-col gap-6 shrink-0">
        <div>
          <p class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-3 px-3">Catalogue</p>
          <nav class="space-y-1">
            <button @click="setTab('top')" :class="activeTab === 'top' ? 'bg-indigo-600/20 text-indigo-400 font-semibold' : 'text-slate-400 hover:text-slate-200'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm transition">
              <i class="fa-solid fa-fire text-amber-500"></i><span>Top Animes</span>
            </button>
            <button @click="setTab('airing')" :class="activeTab === 'airing' ? 'bg-indigo-600/20 text-indigo-400 font-semibold' : 'text-slate-400 hover:text-slate-200'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm transition">
              <i class="fa-solid fa-tv text-sky-400"></i><span>Saison Actuelle</span>
            </button>
            <button @click="setTab('watchlist')" :class="activeTab === 'watchlist' ? 'bg-indigo-600/20 text-indigo-400 font-semibold' : 'text-slate-400 hover:text-slate-200'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm transition mt-4 border border-slate-800 bg-slate-900/50">
              <i class="fa-solid fa-bookmark text-emerald-400"></i><span>Ma Liste Officielle</span>
            </button>
          </nav>
        </div>
      </aside>

      <main class="flex-1 p-4 sm:p-6 md:p-8">
        <div class="flex items-center justify-between mb-4 sm:mb-6">
          <h1 class="text-lg sm:text-2xl font-bold text-slate-100 flex items-center gap-2.5">
            <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>{{ pageTitle }}
          </h1>
        </div>

        <div v-if="loading" class="flex flex-col items-center justify-center py-20">
          <div class="w-8 h-8 border-4 border-indigo-
